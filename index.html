<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6bcb">
  <meta name="description" content="음성공장 통근버스 노선과 정류장 시간을 빠르게 조회합니다.">
  <title>음성공장 통근버스</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="topbar">
    <div class="shell topbar__inner">
      <a class="brand" href="./" aria-label="통근버스 홈">
        <span class="brand__mark" aria-hidden="true">B</span>
        <span><strong>통근버스</strong><small>음성공장 노선 안내</small></span>
      </a>
      <div class="topbar__actions">
        <button class="icon-button" id="themeButton" type="button" aria-label="화면 테마 전환" title="화면 테마 전환">◐</button>
        <button class="button button--ghost install-button" id="installButton" type="button" hidden>앱 설치</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="shell">
        <p class="eyebrow">BUS ROUTE FINDER</p>
        <h1>내 통근버스를<br><span>빠르게 찾아보세요.</span></h1>
        <p class="hero__copy">노선명이나 정류장 이름을 검색하면 필요한 시간표만 바로 확인할 수 있습니다.</p>
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <label class="sr-only" for="searchInput">노선 또는 정류장 검색</label>
          <input id="searchInput" type="search" autocomplete="off" placeholder="예: 율량, 봉명, 충주, 22시">
          <button id="clearSearch" class="search-box__clear" type="button" aria-label="검색어 지우기" hidden>×</button>
        </div>
        <div class="quick-stats" aria-label="노선 통계">
          <span><strong id="routeCount">51</strong>개 노선</span>
          <span><strong id="stopCount">462</strong>개 정류장 기록</span>
          <span><strong>설치 불필요</strong></span>
        </div>
      </div>
    </section>

    <section class="shell content-section" aria-labelledby="noticeTitle">
      <div class="notice-card">
        <div class="notice-card__icon" aria-hidden="true">i</div>
        <div><h2 id="noticeTitle">운행 안내</h2><p id="serviceNotice"></p></div>
      </div>
    </section>

    <section class="shell content-section route-browser" aria-labelledby="routesTitle">
      <div class="section-heading">
        <div><p class="eyebrow">ROUTES</p><h2 id="routesTitle">노선 찾기</h2></div>
        <p id="resultSummary" role="status" aria-live="polite"></p>
      </div>

      <div class="category-tabs" id="categoryTabs" aria-label="지역별 노선 필터"></div>

      <div class="filter-row">
        <label><span>운행 유형</span><select id="typeFilter"><option value="">전체</option></select></label>
        <label><span>시간대</span><select id="timeFilter"><option value="">전체</option></select></label>
        <label class="favorite-filter"><input id="favoriteOnly" type="checkbox"><span>★ 즐겨찾기만</span></label>
      </div>

      <div class="route-grid" id="routeGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div aria-hidden="true">⌕</div><h3>검색 결과가 없습니다</h3><p>검색어나 필터를 바꿔 보세요.</p>
        <button class="button button--primary" id="resetFilters" type="button">필터 초기화</button>
      </div>
    </section>

    <section class="shell content-section source-note">
      <p><strong>데이터 기준</strong> <span id="dataSource"></span></p>
      <p>시간이 없는 정류장은 원본대로 <strong>시간 미기재</strong>로 표시합니다.</p>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <p>음성공장 통근버스 노선 안내</p>
      <a href="./admin.html">관리자</a>
    </div>
  </footer>

  <dialog class="route-dialog" id="routeDialog" aria-labelledby="dialogTitle">
    <div class="dialog__header">
      <div><p class="eyebrow" id="dialogEyebrow"></p><h2 id="dialogTitle"></h2><p id="dialogMeta"></p></div>
      <button class="icon-button" id="closeDialog" type="button" aria-label="상세 닫기">×</button>
    </div>
    <div class="dialog__actions">
      <button class="button button--soft" id="dialogFavorite" type="button">☆ 즐겨찾기</button>
      <button class="button button--soft" id="shareRoute" type="button">링크 공유</button>
    </div>
    <div class="route-note" id="dialogNote" hidden></div>
    <ol class="timeline" id="timeline"></ol>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./js/app-data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
